[project]
name = "jobhunt"
version = "0.1.0"
description = "Find relevant roles at the companies you care about, tailor your CV, and apply — with a human approval gate."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown>=3.6",
    "pypdf>=4.0",
]

[project.urls]
Repository = "https://github.com/lnzbati/jobhunt"
Issues = "https://github.com/lnzbati/jobhunt/issues"

[project.optional-dependencies]
pdf = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE"]

[tool.pytest.ini_options]
markers = ["live: hits real careers sites (opt in with JOBHUNT_LIVE=1)"]
