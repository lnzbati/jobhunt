<!doctype html>
<html><head><meta charset="utf-8"><title>{{ me.name }} — CV</title>
<style>{% include "base.css" %}</style></head>
<body>
<header>
  <div class="name">{{ me.name }}</div>
  <div class="contact">
    {% for v in [me.location, me.email, me.phone, me.linkedin, me.github, me.website] if v %}<span>{{ v }}</span>{% endfor %}
  </div>
</header>
<main>{{ body }}</main>
</body></html>
